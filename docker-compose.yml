version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cbs_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: content_broadcasting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cbs_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

