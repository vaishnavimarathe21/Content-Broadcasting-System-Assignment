version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cbs_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: content_broadcasting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cbs_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: cbs_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@postgres:5432/content_broadcasting?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

